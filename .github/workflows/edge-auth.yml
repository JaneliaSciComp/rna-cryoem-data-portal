name: edge_auth

on:
  push:
    branches: [main]
    paths: ["infra/modules/edge_auth/**", ".github/workflows/edge-auth.yml"]
  pull_request:
    paths: ["infra/modules/edge_auth/**", ".github/workflows/edge-auth.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/modules/edge_auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/modules/edge_auth/function/package-lock.json
      - run: npm ci && npm test
        working-directory: infra/modules/edge_auth/function
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform test
