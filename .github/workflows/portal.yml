name: portal

on:
  push:
    branches: [main]
    paths: ["infra/portal/**", "infra/modules/edge_auth/**", ".github/workflows/portal.yml"]
  pull_request:
    paths: ["infra/portal/**", "infra/modules/edge_auth/**", ".github/workflows/portal.yml"]

jobs:
  nginx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: infra/portal/nginx/test.sh

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/modules/edge_auth/function/package-lock.json
      # edge_auth zips its esbuild bundle at plan time.
      - run: npm ci && npm run build
        working-directory: infra/modules/edge_auth/function
      - uses: hashicorp/setup-terraform@v3
      - run: bash -n user_data.sh.tftpl && bash -n scripts/push-images.sh && bash -n nginx/test.sh
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform test
