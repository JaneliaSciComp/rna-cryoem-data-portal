name: app

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["55432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      # The test fixture waits for /health; the image has no curl for a health-cmd.
      typesense:
        image: typesense/typesense:27.1
        env:
          TYPESENSE_API_KEY: test
          TYPESENSE_DATA_DIR: /tmp
        ports: ["58108:8108"]
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          manifest-path: portal/pixi.toml
      - run: pixi run test

  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: portal/backend/test-image.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          manifest-path: portal/pixi.toml
          environments: frontend
      - run: pixi run test-frontend
      - run: pixi run build-frontend
