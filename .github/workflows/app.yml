name: app

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        # Host ports below the Linux ephemeral range (32768-60999) so outbound sockets cannot take them.
        ports: ["15432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      # The test fixture waits for /health; the image has no curl for a health-cmd.
      typesense:
        image: typesense/typesense:27.1
        env:
          TYPESENSE_API_KEY: test
          TYPESENSE_DATA_DIR: /tmp
        ports: ["18108:8108"]
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:15432/postgres
      TEST_TYPESENSE_URL: http://localhost:18108
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          manifest-path: portal/pixi.toml
      - run: pixi run test

  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: portal/backend/test-image.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          manifest-path: portal/pixi.toml
          environments: frontend
      - run: pixi run test-frontend
      - run: pixi run build-frontend
