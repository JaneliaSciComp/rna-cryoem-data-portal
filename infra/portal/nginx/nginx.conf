# Edge proxy for the portal ECS task. Host networking: the api and mrc-ng-server upstreams are on
# 127.0.0.1. This image serves the login page, the portal's single-page app, and Neuroglancer;
# the api authorizes data files and nginx sends them (X-Accel-Redirect).
# TLS ends at CloudFront. Lambda@Edge has already checked the id_token cookie and group.

upstream api {
    server 127.0.0.1:8000;
}

upstream mrcng {
    server 127.0.0.1:8001;
}

server {
    listen 8080 default_server;
    server_name _;

    # Redirects must stay relative: the viewer's host is CloudFront's, and the port isn't 8080.
    absolute_redirect off;

    client_max_body_size 100M;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1100;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        chemical/x-pdb
        chemical/x-mmcif;

    # Portal login page on top of RNAnix's auth.js. Edge-public (see edge_auth public_paths).
    location = /login.html {
        root /usr/share/nginx/html;
    }

    location = /auth.js {
        root /usr/share/nginx/html;
    }

    # auth.js nextUrl() falls back to "index.html" after sign-in; the portal's home is "/".
    location = /index.html {
        return 302 /;
    }

    # The ALB health check. The api answers without touching the database.
    location = /healthz {
        proxy_pass http://api/health;
    }

    # FastAPI: strip the /api prefix (its routes are mounted at /molecules, /files, ...).
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Map volumes for Neuroglancer. mrc-ng-server's routes start at /omezarr/; strip the prefix.
    location /mrc-ng-server/ {
        proxy_pass http://mrcng/;
        proxy_set_header Host $http_host;
    }

    # Data files the api has authorized via X-Accel-Redirect. `internal`: a browser can't
    # request this location directly.
    location /internal/data/ {
        internal;
        alias /data/;
        # /data is an rclone mount, where a read can wait seconds on Drive. Threads keep one
        # slow read from blocking the worker's other requests.
        aio threads;
    }

    location /neuroglancer/ {
        alias /usr/share/nginx/neuroglancer/;
    }

    # The single-page app. Unknown paths get its index.html, so /molecules/<id> links load.
    # (Not try_files ... /index.html: that would hit the redirect above.)
    location / {
        root /usr/share/nginx/app;
        try_files $uri @app;
    }

    location @app {
        root /usr/share/nginx/app;
        add_header Cache-Control "no-cache";
        rewrite ^ /index.html break;
    }
}
