# AWS copy of ai-cryoet deploy/k8s/base/nginx.conf for the portal ECS task. The task uses host
# networking, so the api and frontend upstreams are on 127.0.0.1. Other differences:
#   - No /api/viewer/: fileglancer.int.janelia.org doesn't resolve outside Janelia, and nginx
#     refuses to start on an unresolvable proxy_pass host.
#   - No /mrc-ng-server/ until that service ships.
#   - The login page and auth.js are served from this image.
# TLS ends at CloudFront. Lambda@Edge has already checked the id_token cookie and group.

upstream api {
    server 127.0.0.1:8000;
}

upstream frontend {
    server 127.0.0.1:3000;
}

server {
    listen 8080 default_server;
    server_name _;

    # Redirects must stay relative: the viewer's host is CloudFront's, and the port isn't 8080.
    absolute_redirect off;

    client_max_body_size 100M;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1100;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Portal login page on top of RNAnix's auth.js. Edge-public (see edge_auth public_paths).
    location = /login.html {
        root /usr/share/nginx/html;
    }

    location = /auth.js {
        root /usr/share/nginx/html;
    }

    # auth.js nextUrl() falls back to "index.html" after sign-in; the portal's home is "/".
    location = /index.html {
        return 302 /;
    }

    # FastAPI: strip the /api prefix (its routes are mounted at /samples, /scans, ... with no
    # /api prefix).
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else: the TanStack Start SSR server.
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
