[project]
name = "rna-portal"
version = "0.1.0"
description = "RNA AI CryoEM data portal: catalog scanner and API"
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rna_portal"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

# ponytail: one environment for the API, the scanner, and the tests, so the image is the test
# environment. Split a test feature out if the image size starts to matter.
[tool.pixi.dependencies]
python = "3.12.*"
sqlalchemy = ">=2.0"
psycopg = ">=3.1"
alembic = ">=1.13"
fastapi = ">=0.110"
uvicorn = "*"
gemmi = ">=0.6"
numpy = "*"
pytest = "*"
httpx = "*"

[tool.pixi.pypi-dependencies]
rna-portal = { path = ".", editable = true }
ovito = "*"

[tool.pixi.tasks]
test = "pytest"
db-up = "docker start rna-portal-testdb 2>/dev/null || docker run -d --name rna-portal-testdb -p 55432:5432 -e POSTGRES_PASSWORD=test postgres:16-alpine"
api = "uvicorn rna_portal.api:app --host 127.0.0.1 --port 8000"
scan = "python -m rna_portal.scanner"

[tool.pytest.ini_options]
testpaths = ["tests"]
