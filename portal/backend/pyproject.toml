[project]
name = "rna-portal"
version = "0.1.0"
description = "RNA AI CryoEM data portal: catalog scanner and API"
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rna_portal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
